<h2 class="text-center text-blue-500 font-bold text-3xl my-10">
  Nuestras Motos
</h2>
<div class="w-full overflow-hidden mb-12 md:mb-48">
  <owl-carousel-o [options]="customOptions">
    <ng-template *ngFor="let item of listBanners" carouselSlide>
      <div class="w-full px-2 md:px-12">
        <div class="flex flex-col justify-center items-center">
          <div class="group w-full md:w-[300px] relative">
            <div class="relative">
              <img
                class="w-full h-auto object-cover rounded-lg"
                src="{{ urlRaiz + item.url_carousel }}"
                alt="carousel image"
              />
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </owl-carousel-o>
</div>
