<section class="w-full max-w-7xl mx-auto px-4 py-16">
  <h2 class="text-4xl font-bold text-center mb-16">
    TENEMOS UN<br />ESTILO PARA TI
  </h2>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-8">
    @for (tipo of tiposMotos; track tipo.nombre) {
    <!-- <a
      [routerLink]="tipo.ruta"
      class="flex flex-col items-center group hover:scale-105 transition-transform duration-300"
    > -->
    <a
      [routerLink]="'/motos-por-tipo'"
      class="flex flex-col items-center group hover:scale-105 transition-transform duration-300"
    >
      <div
        class="w-32 h-32 rounded-full bg-gray-100 flex items-center justify-center mb-4 overflow-hidden"
      >
        <img
          [src]="tipo.imagen"
          [alt]="tipo.nombre"
          class="w-24 h-24 object-contain group-hover:scale-110 transition-transform duration-300"
        />
      </div>
      <h3 class="text-lg font-semibold text-center">{{ tipo.nombre }}</h3>
    </a>
    }
  </div>
</section>
